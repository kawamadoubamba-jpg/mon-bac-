<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2f5fd7">
<title>Monbac – Espace de révision Terminale</title>
<link rel="stylesheet" href="/tw.css">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8f5;--card:#fff;--ink:#14231b;--mut:#5b6b62;--line:#dfe6e0;--acc:#1b7a4b;--sun:#f2b705}
:root[data-theme="dark"]{--bg:#0e1612;--card:#16221b;--ink:#e8f0ea;--mut:#9db0a4;--line:#26362c;--acc:#4cc38a;--sun:#f2c94c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#16221b;--ink:#e8f0ea;--mut:#9db0a4;--line:#26362c;--acc:#4cc38a;--sun:#f2c94c;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
h1,h2,h3,.hd{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.mut{color:var(--mut)}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:.5rem .9rem;font-weight:600;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chip{border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;cursor:pointer;background:var(--card);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem;max-width:100%}
.fiche ul{list-style:disc;padding-left:1.2rem;margin:.4rem 0}.fiche li{margin:.25rem 0}.fiche p{margin:.5rem 0;line-height:1.55}.fiche h4{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;color:var(--acc);margin:.9rem 0 .2rem}.fiche .tip{border-left:4px solid var(--sun);padding:.3rem .7rem;margin:.6rem 0;background:var(--bg);border-radius:6px}
.bk{border-left:5px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,transparent);border-radius:10px;padding:.4rem .8rem;margin:.8rem 0}.bk h4{margin-top:.2rem}.bkl{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bc)}.bk-definition{--bc:#2b7de9}.bk-methode{--bc:#1b9a5a}.bk-exemple{--bc:#8a5cf6}.bk-attention{--bc:#d04545}.bk-memo{--bc:#d99a00}.bk-astuce{--bc:#e08a1e}
.tab{padding:.7rem .9rem;cursor:pointer;border:0;background:none;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--sun)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:.35rem 0;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{border-color:#1b9a5a;background:rgba(27,154,90,.18)}.opt.ko{border-color:#d04545;background:rgba(208,69,69,.18)}
.flip{perspective:900px}.flip>div{transition:transform .5s;transform-style:preserve-3d;position:relative;min-height:220px}
.flip.on>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.2rem;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.back{transform:rotateY(180deg);background:var(--acc);color:#fff}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
@media (prefers-reduced-motion:reduce){.flip>div{transition:none}}

/* ===== Refonte : barre du bas + style ===== */
#tabs{display:none}
main{padding-bottom:6rem!important}
.card{box-shadow:0 1px 2px rgba(20,35,27,.06),0 8px 20px -12px rgba(20,35,27,.25)}
.btn{min-height:44px;transition:transform .15s,opacity .15s}.btn:active{transform:scale(.97)}
.chip{min-height:38px;display:inline-flex;align-items:center}
.opt{min-height:46px}
header{backdrop-filter:blur(8px)}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav .in{max-width:56rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bi{background:none;border:0;color:var(--mut);padding:.5rem .1rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.72rem;font-weight:600;cursor:pointer;min-height:56px}
.bi span{font-size:1.35rem;line-height:1.2}
.bi.on{color:var(--acc)}.bi.on span{transform:translateY(-1px)}
.bi.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--sun);margin-top:2px}
#more{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#more.open{display:flex}
#more .sheet{width:100%;max-width:56rem;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
#more .g{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.7rem}
#more .g button{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:.8rem .3rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.85rem;min-height:72px}
#more .g button span{font-size:1.5rem}
#more .g button.on{border-color:var(--acc);color:var(--acc)}

/* ===== Palette éducative ===== */
:root{--bg:#f3f6ff;--card:#fff;--ink:#16213e;--mut:#5a6785;--line:#dbe3f7;--acc:#2f5fd7;--sun:#ffc533;--onacc:#fff;--hg1:#2f5fd7;--hg2:#5b3fd1}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#eaf0ff;--mut:#9fb0d6;--line:#26325a;--acc:#7aa2ff;--sun:#ffd24d;--onacc:#0e1424;--hg1:#33509f;--hg2:#4a36a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#eaf0ff;--mut:#9fb0d6;--line:#26325a;--acc:#7aa2ff;--sun:#ffd24d;--onacc:#0e1424;--hg1:#33509f;--hg2:#4a36a8}}
body::before{background:var(--hg1)}
header{background:linear-gradient(135deg,var(--hg1),var(--hg2))!important;border-bottom:0!important}
header h1{color:#fff!important}header h1 span{color:rgba(255,255,255,.8)!important}
header .chip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.btn{color:var(--onacc);box-shadow:0 3px 0 rgba(0,0,0,.2)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{color:var(--ink);box-shadow:none}
.chip.on{background:var(--sc,var(--acc));border-color:var(--sc,var(--acc));color:#fff}
.chip[data-k]::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--sc,var(--acc));margin-right:.4rem;box-shadow:0 0 0 2px #fff}
.chip.on[data-k]::before{background:#fff;box-shadow:none}
.hero{background:linear-gradient(135deg,var(--hg1),var(--hg2));color:#fff;border:0}
.hero .mut{color:rgba(255,255,255,.85)}
.hero .btn{background:var(--sun);color:#1b2440}
.hero .btn.alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.hero h2{color:#fff}
.chip[data-k="philo"]{--sc:#6741d9}main:has(.chip.on[data-k="philo"]) article.card{border-top:5px solid #6741d9}
.chip[data-k="hg"]{--sc:#d9480f}main:has(.chip.on[data-k="hg"]) article.card{border-top:5px solid #d9480f}
.chip[data-k="fr"]{--sc:#c2255c}main:has(.chip.on[data-k="fr"]) article.card{border-top:5px solid #c2255c}
.chip[data-k="eco"]{--sc:#0b7a5f}main:has(.chip.on[data-k="eco"]) article.card{border-top:5px solid #0b7a5f}
.chip[data-k="en"]{--sc:#1971c2}main:has(.chip.on[data-k="en"]) article.card{border-top:5px solid #1971c2}
.chip[data-k="maths"]{--sc:#b45309}main:has(.chip.on[data-k="maths"]) article.card{border-top:5px solid #b45309}
.chip[data-k="svt"]{--sc:#2f9e44}main:has(.chip.on[data-k="svt"]) article.card{border-top:5px solid #2f9e44}
.chip[data-k="eps"]{--sc:#e03131}main:has(.chip.on[data-k="eps"]) article.card{border-top:5px solid #e03131}

/* ===== Finition ===== */
@keyframes up{from{opacity:0;transform:translateY(6px)}}
main>*{animation:up .25s ease both}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
.card{border-radius:16px}
.fiche{font-size:1.04rem}.fiche p,.fiche li{line-height:1.7}.fiche h4{margin-top:1.1rem}
.prow{display:grid;grid-template-columns:8rem 1fr 2.6rem;gap:.6rem;align-items:center;width:100%;background:none;border:0;color:var(--ink);padding:.5rem 0;cursor:pointer;text-align:left}
.pn{font-weight:600;font-size:.9rem}.pc{font-size:.8rem;color:var(--mut);text-align:right}
.pb{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;border-radius:99px;transition:width .5s}
.outils>summary{list-style:none;padding:.2rem 0}.outils>summary::-webkit-details-marker{display:none}
.outils[open]>summary{margin-bottom:.8rem}.outils .card{box-shadow:none;margin-top:.6rem}

/* ===== Thème sombre repensé ===== */
:root{--c-philo:#6741d9;--c-hg:#d9480f;--c-fr:#c2255c;--c-eco:#0b7a5f;--c-en:#1971c2;--c-maths:#b45309;--c-svt:#2f9e44;--c-eps:#e03131;}
:root[data-theme="dark"]{--bg:#0d1017;--card:#161a23;--ink:#e7eaf3;--mut:#9aa4b8;--line:#272d3b;--acc:#8fb4ff;--sun:#f4c95d;--onacc:#0b1020;--hg1:#1b2347;--hg2:#2b2559;color-scheme:dark;--c-philo:#a98bff;--c-hg:#ff9a5c;--c-fr:#f78fb3;--c-eco:#4fdcb0;--c-en:#6bb8ff;--c-maths:#ffc247;--c-svt:#7be08e;--c-eps:#ff8a8a;--dk:1;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#161a23;--ink:#e7eaf3;--mut:#9aa4b8;--line:#272d3b;--acc:#8fb4ff;--sun:#f4c95d;--onacc:#0b1020;--hg1:#1b2347;--hg2:#2b2559;color-scheme:dark;--c-philo:#a98bff;--c-hg:#ff9a5c;--c-fr:#f78fb3;--c-eco:#4fdcb0;--c-en:#6bb8ff;--c-maths:#ffc247;--c-svt:#7be08e;--c-eps:#ff8a8a;--dk:1;}}
.chip[data-k="philo"]{--sc:var(--c-philo)}main:has(.chip.on[data-k="philo"]) article.card{border-top:5px solid var(--c-philo)}
.chip[data-k="hg"]{--sc:var(--c-hg)}main:has(.chip.on[data-k="hg"]) article.card{border-top:5px solid var(--c-hg)}
.chip[data-k="fr"]{--sc:var(--c-fr)}main:has(.chip.on[data-k="fr"]) article.card{border-top:5px solid var(--c-fr)}
.chip[data-k="eco"]{--sc:var(--c-eco)}main:has(.chip.on[data-k="eco"]) article.card{border-top:5px solid var(--c-eco)}
.chip[data-k="en"]{--sc:var(--c-en)}main:has(.chip.on[data-k="en"]) article.card{border-top:5px solid var(--c-en)}
.chip[data-k="maths"]{--sc:var(--c-maths)}main:has(.chip.on[data-k="maths"]) article.card{border-top:5px solid var(--c-maths)}
.chip[data-k="svt"]{--sc:var(--c-svt)}main:has(.chip.on[data-k="svt"]) article.card{border-top:5px solid var(--c-svt)}
.chip[data-k="eps"]{--sc:var(--c-eps)}main:has(.chip.on[data-k="eps"]) article.card{border-top:5px solid var(--c-eps)}
:root[data-theme="dark"] .card{box-shadow:none;border-color:var(--line)}
:root[data-theme="dark"] .chip.on{color:#0b1020}
:root[data-theme="dark"] .chip.on[data-k]::before{background:#0b1020}
:root[data-theme="dark"] .chip[data-k]::before{box-shadow:0 0 0 2px var(--card)}
:root[data-theme="dark"] .back{color:#0b1020}
:root[data-theme="dark"] .btn{box-shadow:0 3px 0 rgba(0,0,0,.45)}
:root[data-theme="dark"] .hero .btn{color:#1b2440}
:root[data-theme="dark"] .bk-definition{--bc:#6ea8ff}.bk-methode{--bc:#4cd697}.bk-exemple{--bc:#b197fc}.bk-attention{--bc:#ff7b7b}.bk-memo{--bc:#ffd166}.bk-astuce{--bc:#ffa94d}
:root[data-theme="dark"] header{border-bottom:1px solid var(--line)!important}
:root[data-theme="dark"] #bnav{background:color-mix(in srgb,var(--card) 92%,transparent)}
:root[data-theme="dark"] #more .sheet{border-top:1px solid var(--line)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .card{box-shadow:none;border-color:var(--line)}
:root:not([data-theme="light"]) .chip.on{color:#0b1020}
:root:not([data-theme="light"]) .chip.on[data-k]::before{background:#0b1020}
:root:not([data-theme="light"]) .chip[data-k]::before{box-shadow:0 0 0 2px var(--card)}
:root:not([data-theme="light"]) .back{color:#0b1020}
:root:not([data-theme="light"]) .btn{box-shadow:0 3px 0 rgba(0,0,0,.45)}
:root:not([data-theme="light"]) .hero .btn{color:#1b2440}
:root:not([data-theme="light"]) .bk-definition{--bc:#6ea8ff}.bk-methode{--bc:#4cd697}.bk-exemple{--bc:#b197fc}.bk-attention{--bc:#ff7b7b}.bk-memo{--bc:#ffd166}.bk-astuce{--bc:#ffa94d}
:root:not([data-theme="light"]) header{border-bottom:1px solid var(--line)!important}
:root:not([data-theme="light"]) #bnav{background:color-mix(in srgb,var(--card) 92%,transparent)}
:root:not([data-theme="light"]) #more .sheet{border-top:1px solid var(--line)}
}
body,.card,header,#bnav{transition:background-color .25s,color .25s,border-color .25s}
@media (prefers-reduced-motion:reduce){body,.card,header,#bnav{transition:none}}
#theme{display:none!important}
:root{color-scheme:light}

/* ===== Motivation + Tania ===== */
.awa{display:flex;gap:.7rem;align-items:center;background:linear-gradient(135deg,var(--hg1),var(--hg2));color:#fff;border-radius:16px;padding:.7rem .9rem;margin-bottom:.7rem}.awa .mut{color:rgba(255,255,255,.85)}
.av{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;background:var(--sun);flex:none;font-size:1.2rem}.av.big{width:3rem;height:3rem;font-size:1.9rem}
.bub{display:flex;gap:.5rem;margin:.6rem 0;max-width:94%}.bub.me{margin-left:auto;background:var(--acc);color:var(--onacc);padding:.55rem .8rem;border-radius:16px 16px 4px 16px}
.bub.ai>div{background:var(--bg);border:1px solid var(--line);padding:.3rem .8rem;border-radius:16px 16px 16px 4px}.bub.ai p{margin:.3rem 0}
.pop{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 4.5rem);z-index:70;background:var(--ink);color:var(--card);padding:.55rem 1rem;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
button.awa{width:100%;border:0;text-align:left;font:inherit;cursor:pointer}
.awa:active{transform:scale(.99)}

/* ===== Espace de Tania ===== */
.pop{z-index:95!important}
#studio{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
#studio.open{display:flex;animation:up .25s ease both}
.st-top{background:linear-gradient(135deg,var(--hg1),var(--hg2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + .6rem) .9rem .7rem;display:flex;align-items:center;gap:.7rem}
.st-x{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:50%;width:2.5rem;height:2.5rem;font-size:1.1rem;cursor:pointer;flex:none}
.st-ctx{padding:.55rem .8rem .6rem;background:var(--card);border-bottom:1px solid var(--line)}
.st-modes{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem .8rem;background:var(--card);border-bottom:1px solid var(--line)}
.st-m{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.45rem .85rem;font-weight:600;font-size:.88rem;cursor:pointer}
.st-m.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.st-body{flex:1;overflow-y:auto;padding:.8rem;-webkit-overflow-scrolling:touch}
.st-start{display:grid;gap:.5rem;margin-top:.6rem}
.st-start button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem;text-align:left;font-weight:600;color:var(--ink);cursor:pointer;font-size:.95rem}
.st-start button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.st-tip{background:color-mix(in srgb,var(--sun) 22%,var(--card));border-radius:14px;padding:.7rem .9rem;font-size:.92rem;margin-top:.6rem}
.st-bar{display:flex;gap:.5rem;align-items:flex-end;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.st-bar textarea{flex:1;min-height:2.6rem;max-height:7rem;resize:none;border-radius:1.3rem;padding:.6rem .9rem;margin:0}
.st-ic{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;flex:none;position:relative}
.st-ic.go{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.st-ic input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.st-spk{background:none;border:0;color:var(--acc);font-size:.8rem;cursor:pointer;padding:.2rem 0}

/* ===== Comptes : formulaires ===== */
.af{max-width:480px;margin:0 auto;padding:1.2rem 1.1rem 1.4rem}
.af .gback{font-size:.9rem;margin-bottom:.6rem}
.af .top{display:flex;align-items:center;gap:.8rem}
.af .logo{width:46px;height:46px;border-radius:13px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font:800 1.5rem 'Bricolage Grotesque',system-ui,sans-serif;flex:none}
.af h2{font-size:1.35rem;font-weight:800;line-height:1.2;margin:0}
.af .top p{margin:.1rem 0 0;font-size:.9rem}
.stp{display:flex;gap:.4rem;margin:1.1rem 0 .4rem}.stp i{flex:1;height:5px;border-radius:9px;background:var(--line)}.stp i.on{background:var(--acc)}
.stl{font-size:.85rem;color:var(--mut);font-weight:600}
.recap{font-size:.92rem;margin:.7rem 0 0;padding:.55rem .8rem;border-radius:10px;background:color-mix(in srgb,var(--acc) 9%,var(--bg))}
.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);font-weight:800;margin:1.3rem 0 .1rem;display:flex;align-items:center;gap:.6rem}.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.fl{margin-top:.8rem}.fl>label{display:block;font-weight:700;font-size:.92rem;margin-bottom:.3rem}
.fl .in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.fl .in:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.fl.bad .in{border-color:#d04545;box-shadow:0 0 0 3px rgba(208,69,69,.15)}
.fl .in input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:.75rem .8rem;font-size:1rem;outline:none;border-radius:0}
.fl .ic{padding-left:.8rem;opacity:.75}
.fl .pre{padding:.75rem .8rem;background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:800;border-right:1.5px solid var(--line);white-space:nowrap}
.fl .eye{border:0;background:none;padding:0 .85rem;cursor:pointer;font-size:1.1rem;color:var(--mut);min-height:44px}
.fl .hint{font-size:.8rem;color:var(--mut);margin-top:.3rem;line-height:1.35}
.fl .er{font-size:.83rem;color:#c43b3b;font-weight:600;margin-top:.25rem}.fl .er:empty{display:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}.row2>*{min-width:0}
.pw{height:5px;border-radius:9px;background:var(--line);margin:.35rem 0 .25rem;overflow:hidden}.pw b{display:block;height:100%;width:0;border-radius:9px;transition:width .2s,background .2s}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tl .t{border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:.55rem .3rem;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:58px;justify-content:center}
.tl .t b{font-size:1.05rem}.tl .t small{font-size:.7rem;color:var(--mut)}
.tl .t.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--bg));box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.tl .t:disabled{opacity:.5;cursor:not-allowed}
.btn.big{width:100%;min-height:50px;font-size:1.05rem;margin-top:1.2rem}
.btns{display:flex;gap:.6rem;margin-top:1.2rem}.btns .btn{flex:1;min-height:50px;font-size:1rem}.btns .btn.alt{flex:.6}
.af .alt2{text-align:center;margin-top:1.1rem;color:var(--mut);font-size:.92rem}
.lnk{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:0;font-size:inherit}
.msg{padding:.65rem .85rem;border-radius:10px;font-size:.92rem;margin-top:.9rem;line-height:1.4}
.msg.ok{background:rgba(27,154,90,.14);color:#0f7a49}.msg.ko{background:rgba(208,69,69,.12);color:#b53030}
.fine{font-size:.76rem;color:var(--mut);margin-top:.9rem;text-align:center;line-height:1.4}
.fgt{text-align:right;margin-top:.5rem;font-size:.88rem}

.tl2{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tl2 .t{border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:.6rem .3rem;cursor:pointer;color:var(--ink);min-height:48px}
.tl2 .t.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--bg));box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.fl textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.75rem;font-size:1rem;background:var(--bg);color:var(--ink);font-family:inherit;line-height:1.5;min-height:260px;resize:vertical}
.fl textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.tbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
</style>
</head>

    <button id="theme" class="chip" aria-label="Changer de thème">🌓</button>
  </div>
  <nav class="max-w-4xl mx-auto tabs px-2" id="tabs"></nav>
</header>
<main class="max-w-4xl mx-auto p-4" id="main"></main>

<script>
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const SUBJ={philo:["Philosophie",6],hg:["Histoire-Géographie",6],fr:["Français",5],en:["Anglais",4],eco:["Économie générale",3],maths:["Mathématiques",2],svt:["SVT / PC",2],eps:["EPS",1]};
const SK=["philo","hg","fr","eco","en","maths"];

/* ---------- Données ---------- */
const FICHES={philo:[],hg:[],fr:[],eco:[],en:[],maths:[]};
const DEEP={};
const FLASH=[
["philo","Origine de la philosophie ?","Grèce antique (VIIᵉ-VIᵉ s. av. J.-C.) : passage du mythos au logos."],
["philo","Hobbes : l’état de nature ?","« L’homme est un loup pour l’homme » ; on cède ses droits à un souverain pour la sécurité."],
["philo","Rousseau : but du contrat social ?","S’unir à tous en restant aussi libre qu’auparavant, en obéissant à la volonté générale."],
["philo","Critère de scientificité (Popper) ?","La falsifiabilité (réfutabilité)."],
["philo","Bachelard et l’opinion ?","« L’opinion a toujours tort » : la science rectifie ses erreurs (obstacles épistémologiques)."],
["philo","Droit naturel / droit positif ?","Naturel : inaliénable, lié à la nature humaine. Positif : lois écrites d’un pays à une époque."],
["philo","Sartre sur la liberté ?","« L’existence précède l’essence » : l’homme se définit par ses choix."],

["hg","Dates de la crise de Cuba et du mur de Berlin ?","Mur de Berlin : 1961 (chute : 9 nov. 1989). Crise des missiles de Cuba : 1962."],
["hg","Bandung 1955 ?","Conférence afro-asiatique qui condamne le colonialisme."],
["hg","Belgrade 1961 ?","Naissance du mouvement des non-alignés."],
["hg","Éclatement de la Fédération du Mali ?","20 août 1960 (Senghor et Modibo Keïta)."],
["hg","Crise de 1962 au Sénégal ?","Senghor contre Mamadou Dia ; Dia arrêté, régime présidentiel."],
["hg","OUA devient UA ?","OUA : 1963 à Addis-Abeba ; Union africaine : 2002."],
["fr","Qui a forgé le mot « négritude » ?","Aimé Césaire, dans <i>Cahier d’un retour au pays natal</i> (1939)."],
["fr","Recueil de Damas ?","<i>Pigments</i> (1937)."],
["fr","Dans <i>Une si longue lettre</i>, qui écrit à qui ?","Ramatoulaye écrit à son amie Aïssatou."],
["fr","Héros de <i>L’Aventure ambiguë</i> ?","Samba Diallo, entre tradition islamique et école occidentale."],
["fr","Formule du commentaire composé ?","Procédé stylistique + citation + effet produit."],
["eco","Croissance ou développement : l’IDH mesure ?","Le développement (indice de 0 à 1)."],
["eco","Balance commerciale ?","Exportations − importations de marchandises."],
["eco","Rôle de la BCEAO ?","Émettre le franc CFA et mener la politique monétaire de l’UEMOA (siège à Dakar)."],
["maths","Dérivée de uv ?","u′v + uv′."],
["maths","Coefficient directeur de la droite de régression ?","a = Cov(x,y) / V(x)."]
];
const QUIZ={
philo:[["Qui a écrit le <i>Léviathan</i> ?",["Rousseau","Hobbes","Locke","Kant"],1,"Hobbes défend un souverain absolu garantissant la sécurité."],
["Selon Popper, une théorie est scientifique si elle est…",["Prouvée définitivement","Populaire","Réfutable","Ancienne"],2,"La falsifiabilité distingue la science de la pseudo-science."],
["Le passage du mythos au logos a lieu…",["En Égypte","En Grèce antique","À Rome","En Chine"],1,"La philosophie naît en Grèce au VIIᵉ-VIᵉ siècle av. J.-C."],
["« L’existence précède l’essence » est une thèse de…",["Platon","Descartes","Sartre","Freud"],2,"C’est la formule centrale de l’existentialisme sartrien."]],
hg:[["La Fédération du Mali éclate en…",["1958","1959","20 août 1960","1962"],2,"Divergences entre Senghor et Modibo Keïta."],
["La conférence de Bandung date de…",["1945","1955","1961","1975"],1,"Elle réunit pays d’Asie et d’Afrique."],
["Chute du mur de Berlin :",["9 nov. 1989","13 août 1961","1991","1975"],0,"Le mur est construit en 1961 et s’ouvre le 9 novembre 1989."],
["L’OUA est remplacée par l’UA en…",["1980","1991","2002","2015"],2,"Lancement de l’Union africaine en 2002."]],
fr:[["<i>Les Bouts de bois de Dieu</i> raconte…",["Une guerre","La grève du Dakar-Niger","Un exil","Un mariage"],1,"Grève des cheminots de 1947-1948."],
["Qui est l’auteur de <i>L’Aventure ambiguë</i> ?",["Bâ","Sembène","Kane","Senghor"],2,"Cheikh Hamidou Kane, 1961."],
["La négritude de Senghor est surtout…",["Politique et armée","Culturelle","Économique","Sportive"],1,"Senghor parle des valeurs culturelles du monde noir."],
["<i>Une si longue lettre</i> est un roman…",["Épistolaire","Policier","Historique","Fantastique"],0,"Il prend la forme d’une lettre."]],
eco:[["Le PIB réel mesure…",["La croissance","L’inflation","Le chômage","La dette"],0,"La variation du PIB réel mesure la croissance."],
["L’IDH varie entre…",["0 et 100","0 et 1","−1 et 1","1 et 10"],1,"Il combine santé, éducation et niveau de vie."],
["Qui défend le protectionnisme éducateur ?",["Ricardo","List","Smith","Keynes"],1,"Friedrich List protège les industries naissantes."]],
en:[["“Brain drain” means…",["Loss of skilled workers abroad","A school exam","A disease","Heavy rain"],0,"Skilled people leave their country to work abroad."],
["“Renewable energy” includes…",["Coal","Solar power","Oil","Gas"],1,"Solar and wind are renewable."],
["“However” expresses…",["Addition","Contrast","Cause","Time"],1,"It introduces a contrast."]],
maths:[["(x³)′ =",["x²","3x²","3x","x⁴"],1,"(xⁿ)′ = nxⁿ⁻¹."],
["P(A) = ",["Cas possibles / favorables","Cas favorables / possibles","A + B","1 − A"],1,"Rapport des cas favorables sur les cas possibles."],
["Le point moyen G a pour coordonnées…",["(x̄ ; ȳ)","(0 ; 0)","(a ; b)","(Σx ; Σy)"],0,"Moyenne des x et moyenne des y."]]
};
const DISS=[["Introduction (amorce, sujet, problématique, plan)",4],["Développement : cohérence et argumentation",8],["Culture : auteurs, œuvres, exemples",4],["Conclusion",2],["Langue et présentation",2]];
const COMP=[["Introduction et problématique",3],["Plan et progression",5],["Connaissances précises (dates, acteurs)",8],["Conclusion",2],["Expression",2]];
const SUJETS=[
["philo","Dissertation de philosophie : La conscience est-elle source de liberté ?",DISS,240],
["philo","Dissertation de philosophie : Faut-il rechercher la vérité à tout prix ?",DISS,240],
["philo","Dissertation de philosophie : Une société sans violence est-elle possible ?",DISS,240],
["hg","Composition d’histoire : La Guerre froide, de la rupture à la détente.",COMP,240],
["hg","Composition d’histoire : L’accès du Sénégal à l’indépendance (1956-1962).",COMP,240],
["hg","Composition de géographie : Mondialisation et pôles de puissance.",COMP,240],
["fr","Dissertation littéraire : La littérature africaine doit-elle être engagée ? Appuyez-vous sur les œuvres étudiées.",DISS,240],
["eco","Économie : Croissance et développement sont-ils synonymes ?",COMP,180]
];

/* ---------- Navigation ---------- */
const TABS=[["dash","Tableau de bord"],["cours","Cours"],["audio","MonBac Audio"],["test","Test de niveau"],["carnet","Carnet"],["flash","Flashcards"],["quiz","Quiz"],["sim","Simulateur"]];
let cur="dash";
const MAINT=['dash','cours','exc','ia'];
const IC={dash:'🏠',cours:'📚',exc:'✏️',ia:'🤖',test:'🎯',carnet:'📓',flash:'🃏',quiz:'❓',sim:'⏱️',ann:'📄',diag:'🩺',plan:'🗓️',pap:'🪜'};
const SHORT={dash:'Accueil',exc:'Exos',ia:'Prof IA'};
function nav(){const lab=t=>SHORT[t[0]]||t[1];
 const m=TABS.filter(t=>MAINT.includes(t[0])).sort((a,b)=>MAINT.indexOf(a[0])-MAINT.indexOf(b[0])),rest=TABS.filter(t=>!MAINT.includes(t[0]));
 const inRest=rest.some(t=>t[0]===cur);
 let b=$('bnav');if(!b){b=document.createElement('div');b.id='bnav';document.body.appendChild(b);const o=document.createElement('div');o.id='more';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.classList.remove('open')}}
 b.innerHTML='<div class="in" role="navigation">'+m.map(t=>`<button class="bi ${t[0]===cur?'on':''}" data-t="${t[0]}" ${t[0]===cur?'aria-current="page"':''}><span>${IC[t[0]]||'•'}</span>${lab(t)}</button>`).join('')+`<button class="bi ${inRest?'on':''}" id="bmore"><span>⋯</span>Plus</button></div>`;
 $('more').innerHTML='<div class="sheet"><p class="hd font-bold">Tous les outils</p><div class="g">'+rest.map(t=>`<button class="${t[0]===cur?'on':''}" data-t="${t[0]}"><span>${IC[t[0]]||'•'}</span>${t[1]}</button>`).join('')+'</div></div>';
 const go=k=>{cur=k;$('more').classList.remove('open');nav();VIEWS[cur]();window.scrollTo(0,0)};
 b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>go(x.dataset.t));
 $('more').querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>go(x.dataset.t));
 $('bmore').onclick=()=>$('more').classList.toggle('open');
 const hd=document.querySelector('header h1 span');if(hd){const c=TABS.find(t=>t[0]===cur);hd.textContent='· '+(c?c[1]:'Terminale')}}
const chips=(keys,sel,fn)=>keys.map(k=>`<button class="chip ${k===sel?'on':''}" data-k="${k}">${SUBJ[k][0]}</button>`).join(" ");
function bindChips(fn){ $("main").querySelectorAll(".chip[data-k]").forEach(c=>c.onclick=()=>fn(c.dataset.k)); }

/* ---------- Tableau de bord ---------- */
let pomo={mode:"w",left:1500,run:false,timer:null};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function dash(){
 const bacDate=S.get("bacDate","2027-07-05");
 const notes=S.get("notes",{}), coefs=S.get("coefs",{});
 $("main").innerHTML=`
 <section class="card mb-4"><h2 class="hd text-lg font-bold">Compte à rebours</h2>
  <p class="text-4xl hd font-bold my-2" id="cd" style="color:var(--acc)"></p>
  <label class="mut text-sm">Date de début des épreuves (à modifier selon le calendrier officiel) <input type="date" id="bd" value="${bacDate}"></label></section>
 <section class="card mb-4"><h2 class="hd text-lg font-bold">Minuteur Pomodoro</h2>
  <p class="mut" id="pm"></p><p class="text-5xl hd font-bold my-2" id="pt"></p>
  <button class="btn" id="pp">Lancer</button> <button class="btn alt" id="pr">Réinitialiser</button></section>
 <section class="card"><h2 class="hd text-lg font-bold">Calculateur de moyenne</h2>
  <p class="mut text-sm mb-2">Saisissez vos notes sur 20. Les coefficients sont modifiables : vérifiez-les auprès de votre établissement.</p>
  <div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="mut text-sm"><th>Matière</th><th>Coef</th><th>Note /20</th></tr></thead><tbody>
  ${Object.keys(SUBJ).map(k=>`<tr><td class="py-1 pr-2">${SUBJ[k][0]}</td><td><input type="number" min="0" max="10" class="w-16" data-c="${k}" value="${coefs[k]??SUBJ[k][1]}"></td><td><input type="number" min="0" max="20" step="0.25" class="w-20" data-n="${k}" value="${notes[k]??''}"></td></tr>`).join("")}
  </tbody></table></div>
  <p class="mt-3 text-xl hd font-bold" id="avg"></p><p class="mut" id="mention"></p></section>`;
 const tick=()=>{const d=new Date($("bd").value+"T08:00:00")-new Date();
  $("cd").textContent=isNaN(d)?"Choisissez une date":d<=0?"C’est le moment !":`${Math.floor(d/864e5)} jours, ${Math.floor(d%864e5/36e5)} h`};
 $("bd").onchange=()=>{S.set("bacDate",$("bd").value);tick()}; tick();
 const calc=()=>{let t=0,c=0;const N={},C={};
  document.querySelectorAll("[data-n]").forEach(i=>{const k=i.dataset.n;const co=parseFloat(document.querySelector(`[data-c=${k}]`).value)||0;C[k]=co;if(i.value!==""){N[k]=i.value;const v=Math.min(20,Math.max(0,parseFloat(i.value)));t+=v*co;c+=co}});
  S.set("notes",N);S.set("coefs",C);
  if(c){const H=S.get("hist",{}),d=new Date(),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));H[m.toISOString().slice(0,10)]=+(t/c).toFixed(2);S.set("hist",H)}
  if(!c){$("avg").textContent="Moyenne : –";$("mention").textContent="";return}
  const a=t/c;$("avg").textContent=`Moyenne : ${a.toFixed(2)} / 20`;
  $("mention").textContent=a>=16?"Mention très bien":a>=14?"Mention bien":a>=12?"Mention assez bien":a>=10?"Admis(e)":a>=8?"Zone du second groupe d’épreuves (règles à vérifier)":"En dessous du seuil : continuez à travailler !"};
 document.querySelectorAll("[data-n],[data-c]").forEach(i=>i.oninput=calc);calc();
 const showP=()=>{$("pm").textContent=pomo.mode==="w"?"Travail (25 min)":"Pause (5 min)";$("pt").textContent=fmt(pomo.left);$("pp").textContent=pomo.run?"Pause":"Lancer"};
 $("pp").onclick=()=>{pomo.run=!pomo.run;clearInterval(pomo.timer);if(pomo.run)pomo.timer=setInterval(()=>{pomo.left--;if(pomo.left<=0){pomo.mode=pomo.mode==="w"?"b":"w";pomo.left=pomo.mode==="w"?1500:300}const t=$("pt");if(t)showP();else clearInterval(pomo.timer)},1000);showP()};
 $("pr").onclick=()=>{clearInterval(pomo.timer);pomo={mode:"w",left:1500,run:false,timer:null};showP()};
 showP();
}

/* ---------- Cours ---------- */
let cSub="philo",cCh=0;
function cours(){
 const L=FICHES[cSub];if(cCh>=L.length)cCh=0;
 const done=S.get("done",{}),key=cSub+cCh;
 $("main").innerHTML=`<div class="flex gap-2 overflow-x-auto pb-3">${chips(SK,cSub)}</div>
 <section class="card mb-3"><h2 class="hd font-bold mb-2">Chapitres de ${SUBJ[cSub][0]} (${L.filter((c,i)=>done[cSub+i]).length}/${L.length} lus)</h2>
 <div class="flex flex-wrap gap-2">${L.map((c,i)=>`<button class="chip ${i===cCh?'on':''}" data-ch="${i}">${done[cSub+i]?'✓ ':''}${c[0]}</button>`).join("")}</div></section>
 <article class="card fiche"><p class="mut text-sm">Chapitre ${cCh+1} sur ${L.length}</p><h3 class="hd font-bold text-xl">${L[cCh][0]}</h3>${DEEP[key]||L[cCh][1]}</article>
 <div class="mt-3 flex flex-wrap gap-2"><button class="btn alt" id="cp">Chapitre précédent</button><button class="btn" id="cd2">${done[key]?'Marqué comme lu':'Marquer comme lu'}</button><button class="btn alt" id="cn">Chapitre suivant</button></div>`;
 bindChips(k=>{cSub=k;cCh=0;cours()});
 $("main").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{cCh=+b.dataset.ch;cours();window.scrollTo(0,0)});
 $("cp").onclick=()=>{cCh=(cCh-1+L.length)%L.length;cours();window.scrollTo(0,0)};
 $("cn").onclick=()=>{cCh=(cCh+1)%L.length;cours();window.scrollTo(0,0)};
 $("cd2").onclick=()=>{const d=S.get("done",{});d[key]=!d[key];S.set("done",d);cours()};
}

/* ---------- Flashcards ---------- */
let fSub="philo",fi=0,fList=[];
function flash(){
 fList=FLASH.filter(c=>c[0]===fSub);if(fi>=fList.length)fi=0;const c=fList[fi];
 $("main").innerHTML=`<div class="flex gap-2 overflow-x-auto pb-3">${chips(SK,fSub)}</div>
 <p class="mut mb-2">Carte ${fi+1} sur ${fList.length}. Touchez la carte pour la retourner.</p>
 <div class="flip" id="fl"><div><div class="face hd text-xl font-bold">${c[1]}</div><div class="face back text-lg">${c[2]}</div></div></div>
 <div class="mt-4 flex gap-2"><button class="btn alt" id="fp">Précédente</button><button class="btn" id="fn">Suivante</button><button class="btn alt" id="fs">Mélanger</button></div>`;
 $("fl").onclick=()=>$("fl").classList.toggle("on");
 $("fp").onclick=()=>{fi=(fi-1+fList.length)%fList.length;flash()};
 $("fn").onclick=()=>{fi=(fi+1)%fList.length;flash()};
 $("fs").onclick=()=>{fi=Math.floor(Math.random()*fList.length);flash()};
 bindChips(k=>{fSub=k;fi=0;flash()});
}

/* ---------- Quiz ---------- */
let qSub="philo",qState={};
function quiz(){
 const Q=QUIZ[qSub];const best=S.get("best",{})[qSub];
 $("main").innerHTML=`<div class="flex gap-2 overflow-x-auto pb-3">${chips(SK,qSub)}</div>
 <p class="mut mb-2">${best!==undefined?`Meilleur score : ${best}/${Q.length}`:"Pas encore de score enregistré."}</p>
 ${Q.map((q,i)=>`<div class="card mb-3" data-q="${i}"><p class="font-semibold">${i+1}. ${q[0]}</p>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}<p class="mut text-sm mt-1" hidden></p></div>`).join("")}
 <p class="hd text-xl font-bold" id="qs"></p>`;
 qState={};
 document.querySelectorAll("[data-q]").forEach(card=>{const i=+card.dataset.q,q=Q[i];
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(qState[i]!==undefined)return;const j=+b.dataset.j;qState[i]=j===q[2];
   card.querySelectorAll(".opt").forEach((o,k)=>{if(k===q[2])o.classList.add("ok");else if(k===j)o.classList.add("ko")});
   const e=card.querySelector("p.mut");e.hidden=false;e.textContent=(j===q[2]?"Bonne réponse. ":"Pas tout à fait. ")+q[3];
   if(Object.keys(qState).length===Q.length){const sc=Object.values(qState).filter(Boolean).length;$("qs").textContent=`Score : ${sc} / ${Q.length}`;
    const B=S.get("best",{});if(B[qSub]===undefined||sc>B[qSub]){B[qSub]=sc;S.set("best",B)}}})});
 bindChips(k=>{qSub=k;quiz()});
}

/* ---------- Simulateur ---------- */
let sim={t:null,left:0,i:0};
function sPick(){
 clearInterval(sim.t);
 $("main").innerHTML=`<section class="card"><h2 class="hd text-lg font-bold mb-1">Simulateur d’examen</h2>
 <p class="mut text-sm mb-3">Sujets d’entraînement dans le style du Bac, rédigés pour cette application (ce ne sont pas des sujets officiels). Travaillez dans les conditions de l’épreuve.</p>

[['Sujet : Puis-je me connaître sans autrui ? Proposez un plan.','I. Oui : introspection, conscience de soi (Descartes). II. Non : le regard et la reconnaissance d’autrui me révèlent (Sartre, Hegel). III. Dépassement : je me connais dans l’échange et le dialogue, la connaissance de soi est relationnelle.']],
[['Rédigez l’introduction de : « Autrui est-il un obstacle à ma liberté ? »','Amorce : nous vivons toujours avec les autres. Sujet reformulé. Problématique : si autrui me limite, il me permet aussi de me construire : est-il obstacle ou condition de ma liberté ? Plan : I. le conflit (Sartre, Hobbes) ; II. la reconnaissance (Hegel, Aristote) ; III. le respect mutuel (Kant, Lévinas).']]];
function histoSvg(){const H=S.get('hist',{}),K=Object.keys(H).sort();

const PAP0={t:"La conscience et l’inconscient",
rapide:`<div class="tip"><b>Accroche.</b> Quand tu conduis une moto ou que tu marches jusqu’au lycée sans réfléchir à chaque pas, est-ce ta ${lx("conscience","conscience")} qui te guide, ou une habitude inconsciente ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>La conscience permet à l’homme d’être présent à lui-même et à ses actes (Descartes).</li><li>Freud montre que nous ne maîtrisons pas tout : l’${lx("inconscient","inconscient")} abrite des désirs ${lx("refoulés","refoulement")}.</li><li>Enjeu au BAC : l’homme est-il maître de lui-même ou le jouet de forces cachées ?</li></ol><p class="mut text-sm">Passe le curseur (ou touche) sur les mots soulignés pour voir leur définition.</p>`,
appro:`<h4>Définitions</h4><ul><li>${lx("Conscience","conscience")} : connaissance immédiate de soi, de ses pensées et du monde.</li><li>${lx("Inconscient","inconscient")} : ce qui agit en nous sans que nous le sachions.</li></ul><h4>Thèse 1 : la conscience fonde la liberté</h4><p>Descartes part du ${lx("cogito","cogito")} : même en doutant de tout, je ne peux douter que je pense. La conscience est la première certitude. Sartre prolonge : « l’existence précède l’essence », l’homme n’a pas de nature fixée d’avance et se définit par ses choix ; il est « condamné à être libre ».</p><h4>Thèse 2 : la conscience a des limites</h4><p>Freud écrit que le moi n’est pas « maître dans sa propre maison » : rêves, lapsus et actes manqués trahissent des désirs refoulés. Exemple concret : tu dis « bonne nuit » à ton professeur au lieu de « bonne journée » sans le vouloir.</p><h4>Exemples de la vie courante</h4><ul><li>Marcher ou conduire sans y penser : l’habitude agit à la place de l’attention.</li><li>Une peur sans raison apparente : souvenir oublié qui continue d’agir.</li></ul><div class="tip"><b>À retenir.</b> Descartes : je suis certain de ce que je pense. Freud : je ne sais pas tout de ce que je pense.</div>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>Ce qu’il faut éviter</b><p>« Freud dit que l’homme n’est pas libre parce que l’inconscient commande tout. »</p><p class="mut text-sm">Défaut : affirmation simpliste et trop catégorique.</p></div><div class="yes"><b>Ce qu’il faut faire</b><p>« Selon la psychanalyse freudienne, le moi n’est pas maître dans sa propre maison, car des désirs refoulés influencent nos choix conscients. »</p><p class="mut text-sm">Qualité : terminologie exacte et nuance.</p></div></div><h4>Pièges fréquents</h4><ul><li>Réciter le cours sans l’appliquer à la question posée.</li><li>Confondre inconscient et « oubli » ou « distraction ».</li><li>Citer un auteur sans expliquer sa thèse.</li></ul><div class="tip"><b>Méthode.</b> Idée, explication, auteur, exemple, puis lien avec le sujet.</div>`,
steps:[["Étape 1 : Décoder le sujet","<ul><li><b>« Toujours »</b> : y a-t-il des exceptions (folie, contrainte, pulsions) ?</li><li><b>« Responsable »</b> : répondre de ses actes, sur le plan moral et juridique.</li></ul>"],["Étape 2 : La problématique","<p>Si l’homme est libre et conscient, il doit assumer ses actes. Mais si des forces inconscientes ou sociales le dépassent, peut-on encore le juger pleinement responsable ?</p>"],["Étape 3 : Plan détaillé et arguments","<ul><li><b>I. Responsable (thèse)</b> : conscience et libre arbitre (Descartes, Sartre). Exemple : devant la loi, l’ignorance n’est pas une excuse.</li><li><b>II. Limites (antithèse)</b> : inconscient (Freud) et milieu social. Exemple : actes sous la contrainte ou en cas de maladie mentale.</li><li><b>III. Un devoir éthique (synthèse)</b> : reconnaître sa responsabilité, c’est préserver sa dignité.</li></ul>"]],
test:[["Qui fonde sa philosophie sur le cogito ?",["Freud","Descartes","Sartre"],1,"Le cogito « Je pense, donc je suis » est de Descartes."],["Le refoulement est…",["Un oubli volontaire","Le rejet de pensées gênantes dans l’inconscient","Une forme de mémoire"],1,"C’est un mécanisme de défense décrit par Freud."],["Quelle idée est bien nuancée ?",["L’inconscient commande tout","Des désirs refoulés influencent nos choix conscients","La conscience ne sert à rien"],1,"On évite les affirmations trop catégoriques."]]};
Object.assign(LX,{autonomie:"Fait de se donner à soi-même sa loi.",determinisme:"Idée que tout phénomène a des causes qui le rendent nécessaire.",bipolaire:"Monde organisé autour de deux puissances rivales.",procede:"Moyen d’écriture (figure, rythme, champ lexical) qui produit un effet."});
const PAP1={s:"Philosophie",t:"La liberté",x:"« Être libre, est-ce faire ce que l’on veut ? »",
rapide:`<div class="tip"><b>Accroche.</b> Si tu fais tout ce qui te passe par la tête sans jamais réfléchir, es-tu vraiment libre ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Le libre arbitre est le pouvoir de choisir par soi-même (Descartes).</li><li>Le ${lx("déterminisme","determinisme")} affirme que tout a des causes : Spinoza dit que l’homme se croit libre parce qu’il ignore les causes de ses désirs.</li><li>Pour Sartre, l’homme est condamné à être libre : il est responsable de ses choix.</li></ol>`,
appro:`<h4>Définitions</h4><ul><li>Liberté : absence de contrainte, mais aussi capacité de se gouverner.</li><li>${lx("Autonomie","autonomie")} : se donner sa propre loi (Kant).</li></ul><h4>Thèses</h4><p><b>Spinoza</b> : un enfant croit désirer le lait librement, un ivrogne croit parler librement : tous ignorent les causes de leurs actes. <b>Rousseau</b> : obéir à une loi qu’on s’est prescrite à soi-même, c’est être libre ; obéir à ses seuls appétits, c’est être esclave.</p><div class="tip"><b>À retenir.</b> Liberté ≠ caprice : être libre, c’est choisir avec raison.</div>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« Être libre, c’est faire tout ce qu’on veut. »</p><p class="mut text-sm">Défaut : confond liberté et caprice.</p></div><div class="yes"><b>À faire</b><p>« Si la liberté se réduit au désir, on dépend de ses pulsions ; Rousseau la lie à l’obéissance à une loi qu’on s’est donnée. »</p><p class="mut text-sm">Qualité : thèse nuancée et appuyée sur un auteur.</p></div></div><h4>Pièges</h4><ul><li>Oublier de définir « libre » et « vouloir ».</li><li>Citer un auteur sans le relier au sujet.</li></ul>`,
steps:[["Étape 1 : Décoder le sujet","<ul><li><b>« Faire ce que l’on veut »</b> : suivre ses désirs, parfois par caprice.</li><li><b>« Libre »</b> : indépendant des contraintes, mais aussi maître de soi.</li></ul>"],["Étape 2 : La problématique","<p>Si la liberté consiste à suivre ses désirs, ne dépend-on pas de ces désirs ? La vraie liberté suppose-t-elle de les maîtriser et de se donner des règles ?</p>"],["Étape 3 : Plan détaillé","<ul><li><b>I.</b> Oui : liberté comme absence de contrainte et libre arbitre (Descartes).</li><li><b>II.</b> Non : désirs et déterminismes nous gouvernent (Spinoza).</li><li><b>III.</b> Autonomie : se donner sa loi (Rousseau, Kant).</li></ul>"]],
test:[["Le déterminisme affirme que…",["Tout phénomène a des causes","L’homme choisit sans cause","Rien n’existe"],0,"Tout phénomène a des causes qui le rendent nécessaire."],["Qui pense que l’homme se croit libre par ignorance des causes ?",["Spinoza","Platon","Sartre"],0,"C’est la thèse de Spinoza."],["Autonomie signifie…",["Se donner à soi-même sa loi","Obéir à autrui","Faire ce qu’on veut"],0,"Autos (soi) et nomos (loi)."]]};
const PAP2={s:"Histoire-Géographie",t:"La guerre froide",x:"Composition : « Le monde bipolaire de 1947 à 1991 »",
rapide:`<div class="tip"><b>Accroche.</b> Pourquoi deux superpuissances qui ne se sont jamais affrontées directement ont-elles tenu le monde en tension pendant plus de 40 ans ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Après 1945, les États-Unis (capitalisme) et l’URSS (communisme) s’opposent dans un monde ${lx("bipolaire","bipolaire")}.</li><li>La rivalité est indirecte : Berlin, Corée, Cuba, course aux armements.</li><li>Elle s’achève avec la chute du mur en 1989 et la dissolution de l’URSS en 1991.</li></ol>`,
appro:`<h4>Repères</h4><ul><li>1947 : doctrine Truman et plan Marshall.</li><li>1949 : création de l’OTAN ; 1955 : pacte de Varsovie.</li><li>1961 : mur de Berlin ; 1962 : crise de Cuba.</li><li>1989 : chute du mur ; 1991 : dissolution de l’URSS.</li></ul><h4>Et l’Afrique ?</h4><p>La décolonisation s’inscrit dans la guerre froide. En 1955, la conférence de Bandung réunit des pays d’Afrique et d’Asie qui refusent de choisir un bloc (non-alignement).</p>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« La guerre froide, c’est quand les USA et l’URSS se battent. »</p><p class="mut text-sm">Défaut : faux, il n’y a pas d’affrontement direct.</p></div><div class="yes"><b>À faire</b><p>« La guerre froide est un affrontement idéologique, économique et indirect entre deux blocs, sans guerre ouverte entre eux (1947-1991). »</p><p class="mut text-sm">Qualité : définition précise et datée.</p></div></div><h4>Pièges</h4><ul><li>Dates imprécises ou absentes.</li><li>Oublier le Tiers-Monde.</li><li>Un plan seulement descriptif.</li></ul>`,
steps:[["Étape 1 : Analyser le sujet","<ul><li><b>Bornes</b> : 1947 (doctrine Truman) et 1991 (fin de l’URSS).</li><li><b>« Bipolaire »</b> : deux pôles de puissance rivaux.</li></ul>"],["Étape 2 : La problématique","<p>Comment l’affrontement entre deux blocs a-t-il structuré le monde, et pourquoi s’est-il achevé sans guerre directe ?</p>"],["Étape 3 : Plan détaillé","<ul><li><b>I.</b> La mise en place des blocs (1947-1953).</li><li><b>II.</b> Une rivalité globale : crises, coexistence pacifique, Tiers-Monde.</li><li><b>III.</b> La fin du monde bipolaire (1979-1991).</li></ul>"]],
test:[["Quel événement marque la fin de la division de Berlin en 1989 ?",["La chute du mur","La crise de Cuba","Le blocus de Berlin"],0,"Le mur tombe en novembre 1989."],["L’OTAN est créée en…",["1949","1955","1962"],0,"1949 ; le pacte de Varsovie date de 1955."],["La conférence de Bandung (1955) réunit…",["Des pays d’Afrique et d’Asie","Les deux superpuissances","Des pays européens"],0,"Elle prépare le non-alignement."]]};
const PAP3={s:"Français",t:"Le commentaire composé",x:"Construire les axes d’un commentaire",
rapide:`<div class="tip"><b>Accroche.</b> Devant un poème, tu sens qu’il touche, mais comment expliquer pourquoi ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Lire le texte et repérer le thème, le ton et les ${lx("procédés","procede")}.</li><li>Regrouper les procédés par idée : ce sont les axes d’étude.</li><li>Rédiger : introduction, 2 à 3 axes avec citations, conclusion.</li></ol>`,
appro:`<h4>Définitions</h4><ul><li><b>Projet de lecture</b> : la question à laquelle le commentaire répond.</li><li><b>Axe</b> : une idée soutenue par plusieurs procédés.</li></ul><h4>Procédés courants</h4><p>Métaphore, comparaison, anaphore, champ lexical, rythme. Chaque paragraphe suit : idée, citation, procédé, interprétation.</p>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« L’auteur utilise une métaphore. »</p><p class="mut text-sm">Défaut : le procédé est nommé, jamais interprété.</p></div><div class="yes"><b>À faire</b><p>« La métaphore [citation] assimile la douleur à une blessure, ce qui rend sa violence presque physique. »</p><p class="mut text-sm">Qualité : citation, procédé et effet.</p></div></div><h4>Pièges</h4><ul><li>Suivre l’ordre des lignes au lieu de faire des axes.</li><li>Paraphraser le texte.</li></ul>`,
steps:[["Étape 1 : Lire et relever","<p>Repère le thème, le ton et les procédés (figures, champs lexicaux, rythme). Note-les au brouillon avec leurs citations.</p>"],["Étape 2 : Le projet de lecture","<p>Formule une question directrice, par exemple : comment le poète exprime-t-il son émotion ?</p>"],["Étape 3 : Construire les axes","<ul><li><b>I.</b> Une émotion intense (champs lexicaux, ponctuation).</li><li><b>II.</b> Des procédés qui la mettent en valeur (métaphores, rythme).</li></ul>"]],
test:[["Les axes d’étude se construisent en…",["Regroupant les procédés par idée","Suivant l’ordre des lignes","Résumant le texte"],0,"Un axe regroupe des procédés autour d’une idée."],["Quel est un procédé d’écriture ?",["L’anaphore","Le paragraphe","Le titre"],0,"L’anaphore répète un mot en début de phrase ou de vers."],["Le projet de lecture est…",["La question directrice annoncée en introduction","La conclusion","Un résumé"],0,"Il guide tout le commentaire."]]};
const PAPS=[PAP0,PAP1,PAP2,PAP3];let PAP=PAP0,PI=0;
let pT="rapide";
function pap(){const T=[["rapide","Révision rapide"],["appro","Cours approfondi"],["methode","Méthode et pièges"],["test","Auto-test"],["exo","Exercice pas à pas"]],R=S.get("pasr"+PI,0),sc=S.get("pasT"+PI,null);
let body="";
if(pT==="test")body=PAP.test.map((q,i)=>`<div class="my-2"><p><b>${i+1}.</b> ${q[0]}</p>${q[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<p class="mut text-sm" data-f="${i}"></p></div>`).join("")+`<p class="mut text-sm">${sc!=null?"Dernier score : "+sc+"/3":"Valide ta compréhension avant l’exercice."}</p>`;
else if(pT==="exo")body=sc==null?`<p>Fais d’abord l’auto-test de 3 questions pour valider ta compréhension.</p><div class="flex gap-2 mt-2"><button class="btn" data-go="test">Faire l’auto-test</button><button class="btn alt" data-force="1">Accéder quand même</button></div>`:`<h3 class="hd font-bold">${PAP.x||"« L’homme est-il toujours responsable de ses actes ? »"}</h3><p class="mut text-sm mb-2">Cherche d’abord par toi-même, puis révèle chaque étape.</p>`+PAP.steps.map((s,i)=>`<div class="card my-2"><b>${s[0]}</b>${i<R?`<div class="fiche">${s[1]}</div>`:`<textarea rows="2" class="w-full my-2" placeholder="Ton essai (facultatif)"></textarea><button class="btn" data-r="${i}" ${i>R?"disabled style='opacity:.5'":""}>Révéler l’étape</button>`}</div>`).join("")+(R?`<button class="btn alt" id="pr0">Recommencer</button>`:"");
else body=`<div class="fiche">${PAP[pT]}</div>`;
$("main").innerHTML=`<div class="flex gap-2 overflow-x-auto pb-1">${PAPS.map((c,i)=>`<button class="chip ${i===PI?"on":""}" data-c="${i}">${c.s||"Philosophie"} · ${c.t}</button>`).join("")}</div><div class="tabs my-2">${T.map(t=>`<button class="tab ${t[0]===pT?"on":""}" data-p="${t[0]}">${t[1]}</button>`).join("")}</div><div class="card">${body}</div>`;
const m=$("main");m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{PI=+b.dataset.c;PAP=PAPS[PI];pT="rapide";pap()});m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pT=b.dataset.p;pap()});
m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{pT="test";pap()});
m.querySelectorAll("[data-force]").forEach(b=>b.onclick=()=>{S.set("pasT"+PI,0);pap()});
m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.set("pasr"+PI,+b.dataset.r+1);pap()});
if($("pr0"))$("pr0").onclick=()=>{S.set("pasr"+PI,0);pap()};
let got=0,done=0;m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,q=PAP.test[i],g=m.querySelectorAll(`[data-q='${i}']`);if(g[0].disabled)return;g.forEach((o,k)=>{o.disabled=true;if(k===q[2])o.classList.add("ok");else if(k===j)o.classList.add("ko")});m.querySelector(`[data-f='${i}']`).textContent=(j===q[2]?"Bonne réponse. ":"Pas tout à fait. ")+q[3];if(j===q[2])got++;if(++done===3){S.set("pasT"+PI,got);setTimeout(()=>{pT="exo";pap()},1800)}})}
TABS.push(["pap","Pas à pas"]);VIEWS.pap=pap;

const EXC=[
{id:'c1',s:'philo',n:'Expliquer une formule',l:'Facile',
q:'Expliquez la formule de Descartes : « Je pense, donc je suis ».',
r:`<p>Descartes cherche une chose dont on ne peut <b>absolument pas</b> douter. Imagine que tu doutes de tout : même en train de douter, <b>tu es bien là</b> pour douter. Donc une chose est sûre : tu existes.</p>`,
st:[['1. Je comprends la consigne',`<p>« Expliquer » = dire ce que la phrase veut dire <b>et</b> pourquoi l’auteur l’affirme. Je me pose 3 questions : <b>qui</b> parle ? <b>dans quel but</b> ? <b>qu’est-ce que ça prouve</b> ?</p>`],
['2. Je rassemble mes idées (brouillon)',`<ul><li><b>Qui</b> : Descartes, philosophe du XVIIᵉ siècle.</li><li><b>But</b> : trouver une vérité absolument certaine pour fonder la connaissance.</li><li><b>Méthode</b> : le doute radical (les sens trompent, on confond rêve et réalité, un « malin génie » pourrait nous tromper).</li><li><b>Découverte</b> : même si je me trompe sur tout, il faut bien que je pense pour me tromper.</li><li><b>Conclusion</b> : la pensée prouve mon existence. C’est le <b>cogito</b>.</li></ul>`],
['3. Je rédige la réponse',`<p>« Cette formule est de Descartes. Il cherche une vérité qui résiste à tous les doutes. Il doute donc de ses sens, des rêves et même des mathématiques. Mais il remarque que, pour douter, il faut penser, et que pour penser, il faut exister. Ainsi, "je pense" prouve "je suis". Cette première certitude, le cogito, devient le point de départ de toute sa philosophie : la pensée est la preuve de l’existence. »</p>`]],
e:`<ul><li>Croire que « je n’existe que quand je pense » : faux, la pensée est la <b>preuve</b>, pas la condition.</li><li>Oublier de parler du <b>doute</b> : sans lui, la formule n’a pas de sens.</li><li>Réciter la formule sans l’expliquer avec ses propres mots.</li></ul>`,
a:`Explique en 6 lignes : « L’existence précède l’essence » (Sartre). Indice : l’essence, c’est ce qu’on est « par nature », comme un couteau fabriqué pour couper.`},
{id:'c2',s:'philo',n:'Construire un plan',l:'Bac normal',
q:'Sujet de dissertation : « Peut-on se connaître soi-même ? »',
r:`<p>Un plan, c’est une réponse en 3 temps : <b>Oui</b> (première idée), <b>Mais non</b> (l’idée contraire), <b>Et alors ?</b> (une solution qui dépasse les deux). Chaque partie contient : une idée, un auteur, un exemple.</p>`,
st:[['1. Je décode le sujet',`<ul><li><b>« Peut-on »</b> : est-ce possible ?</li><li><b>« Se connaître »</b> : savoir qui je suis vraiment (mes désirs, mes qualités, mes limites).</li><li><b>« Soi-même »</b> : par moi seul, sans l’aide des autres.</li></ul>`],
['2. Je trouve la problématique',`<p>Je me crois transparent à moi-même parce que j’ai conscience de mes pensées. Pourtant Freud montre qu’une partie de moi m’échappe. <b>Problématique</b> : la conscience suffit-elle pour se connaître, et sinon, par quelles voies peut-on y parvenir ?</p>`],
['3. Je construis le plan',`<ul><li><b>I. Oui, par la conscience</b> : l’introspection me donne accès à mes pensées (Descartes) ; « Connais-toi toi-même » (Socrate). <i>Exemple</i> : je sais que j’ai peur avant un examen.</li><li><b>II. Non, une part m’échappe</b> : l’inconscient (Freud : le moi « n’est pas maître dans sa propre maison »), le regard déformant de l’amour-propre. <i>Exemple</i> : un lapsus qui trahit ce que je cachais.</li><li><b>III. On se connaît par l’action et les autres</b> : je me découvre par ce que je fais (Sartre), et les autres me renvoient une image de moi. <i>Exemple</i> : c’est en affrontant une difficulté qu’on découvre son courage.</li></ul>`],
['4. J’écris l’introduction',`<p><b>Amorce</b> : « Connais-toi toi-même » était gravé à l’entrée du temple de Delphes. <b>Sujet</b> : cette ancienne maxime suppose qu’on peut se connaître. <b>Problématique</b> : pourtant, la conscience suffit-elle à connaître ce que nous sommes vraiment ? <b>Plan</b> : nous verrons d’abord que la conscience donne accès à soi, puis que l’inconscient limite cette connaissance, enfin que l’action et autrui nous révèlent à nous-mêmes.</p>`]],
e:`<ul><li>Faire un plan « pour / contre » sans lien entre les parties.</li><li>Citer un auteur sans expliquer son idée.</li><li>Une partie III qui répète la partie I.</li></ul>`,
a:`Construis le plan (3 parties avec idée, auteur, exemple) du sujet : « La liberté est-elle une illusion ? »`},
{id:'h1',s:'hg',n:'Expliquer des causes',l:'Facile',
q:'Expliquez les causes de l’éclatement de la Fédération du Mali (août 1960).',
r:`<p>Une « cause » répond à la question <b>pourquoi ?</b>. On ne raconte pas toute l’histoire : on range les raisons en groupes (politique, idéologique, rivalités de pouvoir) et on donne des faits précis.</p>`,
st:[['1. Je place les repères (frise)',`<ul><li>1956 : loi-cadre Defferre. 1958 : référendum.</li><li>Janvier 1959 : naissance de la Fédération du Mali (Sénégal + Soudan français).</li><li>20 juin 1960 : indépendance de la Fédération.</li><li><b>20 août 1960</b> : le Sénégal proclame sa sortie ; la fédération éclate.</li><li>Septembre 1960 : le Soudan devient la République du Mali.</li></ul>`],
['2. Je cherche les causes par groupes',`<ul><li><b>Politique</b> : désaccord sur le type d’État. Le Soudan voulait une fédération forte et centralisée ; le Sénégal, plus d’autonomie.</li><li><b>Idéologique</b> : le Soudan (US-RDA de Modibo Keïta) était plus radical et socialiste ; le Sénégal de Senghor, plus modéré et proche de la France.</li><li><b>Rivalité de pouvoir</b> : tension entre les dirigeants sur la direction de la fédération et sur le choix du chef de l’État fédéral.</li></ul>`],
['3. Je rédige la réponse',`<p>« La Fédération du Mali, formée en 1959 par le Sénégal et le Soudan, éclate le 20 août 1960, deux mois après son indépendance. Les causes sont d’abord politiques : le Soudan veut un État fédéral fort, le Sénégal défend davantage d’autonomie. Elles sont aussi idéologiques : le Soudan est plus radical, le Sénégal plus modéré. Enfin, la rivalité entre Modibo Keïta et Senghor pour la direction de la fédération précipite la rupture. Le Sénégal proclame alors son indépendance. »</p>`]],
e:`<ul><li>Confondre la <b>Fédération du Mali</b> (1959-1960) et le Mali actuel.</li><li>Oublier les dates précises.</li><li>Parler de « guerre » : c’est une crise politique, non un conflit armé.</li></ul>`,
a:`Explique en 5 lignes les causes de la crise de décembre 1962 entre Senghor et Mamadou Dia.`},
{id:'f1',s:'fr',n:'Analyser un procédé',l:'Facile',
q:'Phrase écrite pour l’exercice : « Ma peine est un fleuve sans rive qui coule en moi jour et nuit. » Rédigez un paragraphe de commentaire.',
r:`<p>Un commentaire suit toujours la même formule : <b>Procédé</b> (le nom de la figure) + <b>Citation</b> (les mots du texte) + <b>Effet</b> (ce que ça fait ressentir). Sans l’effet, le paragraphe est incomplet.</p>`,
st:[['1. Je repère le procédé',`<p>« Ma peine <b>est</b> un fleuve » : le verbe « est » relie deux choses sans le mot « comme ». C’est une <b>métaphore</b>. S’il y avait « comme », ce serait une <b>comparaison</b>.</p>`],
['2. Je décode chaque élément',`<ul><li><b>Peine</b> : un sentiment, on ne le voit pas.</li><li><b>Fleuve</b> : grand, puissant, qui ne s’arrête pas.</li><li><b>Sans rive</b> : sans limite, impossible à contenir.</li><li><b>Jour et nuit</b> : continuité, aucune pause.</li></ul>`],
['3. J’écris le paragraphe',`<p>« Le poète exprime l’ampleur de sa douleur. La métaphore "Ma peine est un fleuve sans rive" assimile le chagrin à un fleuve immense et sans limites. Elle rend la douleur visible et presque impossible à arrêter. L’expression "jour et nuit" renforce cette idée : la souffrance ne connaît aucun repos. »</p>`]],
e:`<ul><li>Écrire seulement « L’auteur utilise une métaphore » sans dire l’effet.</li><li>Confondre métaphore et comparaison.</li><li>Répéter la phrase avec d’autres mots (paraphrase) au lieu de l’interpréter.</li></ul>`,
a:`Analyse : « Sa colère éclata comme un orage. » Quel procédé ? Quel effet ? Écris 3 lignes.`},
{id:'e1',s:'eco',n:'Croissance nominale et réelle',l:'Facile',
q:'Le PIB nominal est de 8 000 milliards de F CFA en 2022 et 8 400 en 2023. L’indice des prix passe de 100 à 105. 1) Calculez le taux de croissance nominal. 2) Le taux d’inflation. 3) Le PIB réel 2023 et la croissance réelle.',
r:`<p>Le PIB <b>nominal</b> est compté avec les prix du jour : si les prix montent, il monte même sans production en plus. Le PIB <b>réel</b> enlève l’effet des prix pour mesurer la vraie production.</p>`,
st:[['1. Je choisis la formule',`<p><b>Taux de variation</b> = (valeur finale − valeur initiale) ÷ valeur initiale × 100.</p>`],
['2. Questions 1 et 2',`<ul><li>Croissance nominale = (8 400 − 8 000) ÷ 8 000 × 100 = 400 ÷ 8 000 × 100 = <b>5 %</b>.</li><li>Inflation = (105 − 100) ÷ 100 × 100 = <b>5 %</b>.</li></ul>`],
['3. Question 3 : PIB réel',`<p>PIB réel 2023 = PIB nominal ÷ indice des prix × 100 = 8 400 ÷ 105 × 100 = <b>8 000 milliards</b> (aux prix de 2022). Croissance réelle = (8 000 − 8 000) ÷ 8 000 × 100 = <b>0 %</b>.</p>`],
['4. J’interprète',`<p>Le PIB nominal augmente de 5 %, mais les prix augmentent aussi de 5 % : le pays n’a <b>pas produit plus</b>. La hausse est seulement apparente.</p>`]],
e:`<ul><li>Diviser par la valeur finale au lieu de la valeur initiale.</li><li>Oublier de multiplier par 100.</li><li>Confondre PIB nominal et PIB réel.</li></ul>`,
a:`PIB nominal : 5 000 puis 5 600 ; indice des prix : 100 puis 104. Calcule la croissance nominale, le PIB réel et la croissance réelle (≈ 7,7 %).`},
{id:'m1',s:'maths',n:'Étude d’une fonction',l:'Bac normal',
q:'Soit f(x) = x² − 4x + 3. 1) Trouvez les racines. 2) Calculez f′(x) et étudiez les variations. 3) Donnez le minimum.',
r:`<p>La <b>dérivée</b> mesure la pente de la courbe. Pente négative : la courbe descend. Pente positive : elle monte. Quand la pente vaut 0, la courbe change de sens (sommet).</p>`,
st:[['1. Les racines : résoudre f(x) = 0',`<ul><li>a = 1, b = −4, c = 3.</li><li>Δ = b² − 4ac = 16 − 12 = <b>4</b> (positif : deux racines).</li><li>x₁ = (4 − 2) ÷ 2 = <b>1</b> et x₂ = (4 + 2) ÷ 2 = <b>3</b>.</li></ul>`],
['2. La dérivée',`<p>f′(x) = 2x − 4. On cherche quand elle s’annule : 2x − 4 = 0 donc x = 2.</p>`],
['3. Le signe de f′ et le tableau',`<ul><li>Si x &lt; 2 : f′(x) &lt; 0, donc f est <b>décroissante</b>.</li><li>Si x &gt; 2 : f′(x) &gt; 0, donc f est <b>croissante</b>.</li><li>f(2) = 4 − 8 + 3 = <b>−1</b>.</li></ul>`],
['4. Je conclus',`<p>f décroît sur ]−∞ ; 2], croît sur [2 ; +∞[ et admet un <b>minimum égal à −1</b>, atteint en x = 2. Le sommet de la parabole est S(2 ; −1).</p>`]],
e:`<ul><li>Se tromper de signe en calculant Δ.</li><li>Oublier de calculer f(2) pour donner la valeur du minimum.</li><li>Écrire la dérivée avec une erreur (ex : 2x au lieu de 2x − 4).</li></ul>`,
a:`Fais le même travail avec g(x) = x² − 6x + 5. Vérifie : racines 1 et 5, sommet S(3 ; −4).`}];

const escH=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=t=>escH(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function txt2html(t){const out=[];let ul=[],p=[];const fp=()=>{if(p.length){out.push('<p>'+p.map(inl).join('<br>')+'</p>');p=[]}},fu=()=>{if(ul.length){out.push('<ul>'+ul.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');ul=[]}};
 String(t).replace(/\r/g,'').split('\n').forEach(l=>{const x=l.trim();let m;
  if(!x){fp();fu();return}
  if(m=x.match(/^#{1,3}\s+(.*)$/)){fp();fu();out.push('<h4>'+inl(m[1])+'</h4>')}
  else if(m=x.match(/^[-•]\s+(.*)$/)){fp();ul.push(m[1])}
  else if(m=x.match(/^>\s?(.*)$/)){fp();fu();out.push('<div class="tip">'+inl(m[1])+'</div>')}
  else{fu();p.push(x)}});fp();fu();return out.join('')}
